[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "webull-ai-trader"
version = "0.1.0"
description = "Read-only Webull account snapshot agent"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mcp>=1.9,<2",
  "python-dotenv>=1.1,<2",
  "structlog>=25.1,<26",
]

[project.scripts]
webull-account-summary = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
