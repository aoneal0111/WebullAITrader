name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app main.py

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: webull-ai-trader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime imports
        run: |
          docker run --rm --entrypoint python webull-ai-trader:ci -c \
            "import pandas; import pandas_market_calendars; import app.operational_main; print('Container import check passed')"

      - name: Verify non-root runtime user
        run: |
          test "$(docker run --rm --entrypoint id webull-ai-trader:ci -u)" = "10001"
